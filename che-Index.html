<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chemical Coordination &amp; Integration — Mock Test (186 Qs)</title>
  <style>
    :root {
      --bg: #000000;
      --card: #0c0c0f;
      --opt: #141419;
      --border: #26262e;
      --text: #f5f5f7;
      --muted: #9ca3af;
      --accent: #38bdf8;
      --accent-bg: rgba(56, 189, 248, 0.14);
      --ok: #22c55e;
      --ok-bg: rgba(34, 197, 94, 0.16);
      --bad: #ef4444;
      --bad-bg: rgba(239, 68, 68, 0.16);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      padding-bottom: 90px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 60;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }

    .topbar-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .hud { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .pill {
      background: var(--opt);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-variant-numeric: tabular-nums;
    }

    button {
      cursor: pointer;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--opt);
      color: var(--text);
      padding: 8px 13px;
      font-size: 0.84rem;
      font-weight: 600;
    }

    button:hover { border-color: var(--accent); background: var(--accent-bg); }

    .btn-submit {
      background: var(--accent);
      color: #000000;
      border-color: var(--accent);
    }

    .main { max-width: 960px; margin: 18px auto 0; padding: 0 16px; }

    /* Floating overlay modal over current scroll position */
    .palette-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(4px);
      padding: 72px 16px 24px;
      overflow-y: auto;
    }

    .palette-backdrop.open { display: flex; justify-content: center; align-items: flex-start; }

    .palette-panel {
      width: 100%;
      max-width: 820px;
      background: #0b0b0e;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
    }

    .palette-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .sec-jump-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      margin-bottom: 14px;
    }

    .sec-jump-btn {
      padding: 6px 11px;
      font-size: 0.78rem;
      border-radius: 999px;
      background: #14141a;
    }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
      gap: 6px;
      max-height: 300px;
      overflow-y: auto;
      margin-top: 8px;
    }

    .pal-btn { padding: 6px 0; font-size: 0.78rem; font-variant-numeric: tabular-nums; }
    .pal-btn.done { border-color: var(--accent); background: var(--accent-bg); }
    .pal-btn.right { border-color: var(--ok); background: var(--ok-bg); color: #86efac; }
    .pal-btn.wrong { border-color: var(--bad); background: var(--bad-bg); color: #fca5a5; }

    .sec-divider {
      margin: 10px 0 2px;
      padding: 10px 14px;
      background: #111117;
      border-left: 3px solid var(--accent);
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      scroll-margin-top: 76px;
    }

    .review-banner {
      display: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 18px;
    }

    .review-banner.show { display: block; }

    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 8px;
      font-size: 0.92rem;
    }

    .q-list { display: flex; flex-direction: column; gap: 14px; }

    .q-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      scroll-margin-top: 76px;
    }

    .q-num { font-size: 0.8rem; color: var(--accent); font-weight: 700; margin-bottom: 6px; }
    .q-text { font-size: 0.96rem; margin-bottom: 10px; white-space: pre-line; }

    /* Image CSS for questions with diagrams/flowcharts (e.g., image/q-3.jpg) */
    .q-img-box {
      margin: 10px 0 12px;
      padding: 8px;
      background: #0a0a0d;
      border: 1px solid var(--border);
      border-radius: 10px;
      text-align: center;
    }

    .q-img {
      display: block;
      max-width: 100%;
      max-height: 360px;
      width: auto;
      height: auto;
      margin: 0 auto;
      border-radius: 6px;
      object-fit: contain;
    }

    .opts { display: grid; grid-template-columns: 1fr; gap: 8px; }

    .opt-btn {
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      font-weight: 500;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .opt-btn.picked { border-color: var(--accent); background: var(--accent-bg); }
    .opt-btn.right { border-color: var(--ok); background: var(--ok-bg); color: #dcfce7; }
    .opt-btn.wrong { border-color: var(--bad); background: var(--bad-bg); color: #fee2e2; }

    .ans-review {
      display: none;
      margin-top: 10px;
      font-size: 0.84rem;
      color: var(--muted);
    }

    .ans-review.show { display: block; }
  </style>
</head>

    ];

    const QUESTIONS = [...PART_1, ...PART_2].map((item, idx) => ({
      ...item,
      a: idx < 105 ? KEY_1_105[idx] : item.a
    }));

    const picks = {};
    let submitted = false;
    let gridOpen = false;
    let elapsedSec = 0;

    const elapsedEl = document.getElementById("elapsed");
    const doneCountEl = document.getElementById("doneCount");
    const paletteBackdropEl = document.getElementById("paletteBackdrop");
    const secJumpBarEl = document.getElementById("secJumpBar");
    const paletteGridEl = document.getElementById("paletteGrid");
    const reviewBannerEl = document.getElementById("reviewBanner");
    const qListEl = document.getElementById("qList");

    const setGridOpen = (open) => {
      gridOpen = open;
      paletteBackdropEl.classList.toggle("open", gridOpen);
    };

    const jumpToTarget = (el) => {
      setGridOpen(false);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    };

    const fmtTime = (s) => {
      const h = String(Math.floor(s / 3600)).padStart(2, "0");
      const m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
      const r = String(s % 60).padStart(2, "0");
      return `${h}:${m}:${r}`;
    };

    setInterval(() => {
      if (!submitted) {
        elapsedSec += 1;
        elapsedEl.textContent = fmtTime(elapsedSec);
      }
    }, 1000);function buildSectionJumpButtons() {
      secJumpBarEl.innerHTML = "";
      SECTIONS.forEach((sec) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "sec-jump-btn";
        btn.textContent = sec.label;
        btn.onclick = () => jumpToTarget(document.getElementById(sec.id));
        secJumpBarEl.appendChild(btn);
      });
    }

    function render() {
      paletteGridEl.innerHTML = "";
      qListEl.innerHTML = "";

      let done = 0;
      let right = 0;
      let wrong = 0;
      let skip = 0;

      const secByStart = Object.fromEntries(SECTIONS.map((s) => [s.start, s]));

      QUESTIONS.forEach((q) => {
        if (secByStart[q.id]) {
          const div = document.createElement("div");
          div.className = "sec-divider";
          div.id = secByStart[q.id].id;
          div.textContent = secByStart[q.id].label;
          qListEl.appendChild(div);
        }

        const chosenIdx = picks[q.id];
        if (chosenIdx !== undefined) done += 1;

        const ansIdx = q.a ? ANS_MAP[q.a] : undefined;

        const palBtn = document.createElement("button");
        palBtn.type = "button";
        palBtn.className = "pal-btn";
        palBtn.textContent = q.id;
        if (chosenIdx !== undefined) palBtn.classList.add("done");

        if (submitted) {
          palBtn.classList.remove("done");
          if (chosenIdx === undefined) {
            skip += 1;
          } else if (ansIdx !== undefined && chosenIdx === ansIdx) {
            right += 1;
            palBtn.classList.add("right");
          } else if (ansIdx !== undefined) {
            wrong += 1;
            palBtn.classList.add("wrong");
          }
        }

        palBtn.onclick = () => jumpToTarget(document.getElementById(`q-${q.id}`));
        paletteGridEl.appendChild(palBtn);

        const card = document.createElement("article");
        card.className = "q-card";
        card.id = `q-${q.id}`;

        const qNum = document.createElement("div");
        qNum.className = "q-num";
        qNum.textContent = `Question ${q.id} / 186`;
        card.appendChild(qNum);

        const qText = document.createElement("div");
        qText.className = "q-text";
        qText.textContent = q.q;
        card.appendChild(qText);

        const imgBox = document.createElement("div");
        imgBox.className = "q-img-box";
        imgBox.style.display = "none";
        const img = document.createElement("img");
        img.className = "q-img";
        img.src = q.img;
        img.alt = `Question ${q.id} image`;
        img.loading = "lazy";
        img.onload = () => { imgBox.style.display = "block"; };
        img.onerror = () => { imgBox.style.display = "none"; };
        imgBox.appendChild(img);
        card.appendChild(imgBox);

        const opts = document.createElement("div");
        opts.className = "opts";

        q.o.forEach((optText, i) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "opt-btn";
          btn.disabled = submitted;
          if (chosenIdx === i) btn.classList.add("picked");
          if (submitted && ansIdx !== undefined) {
            if (i === ansIdx) btn.classList.add("right");
            else if (chosenIdx === i) btn.classList.add("wrong");
          }
          btn.innerHTML = `<strong>(${LETTERS[i]})</strong><span>${optText}</span>`;
          btn.onclick = () => {
            if (submitted) return;
            picks[q.id] = i;
            render();
          };
          opts.appendChild(btn);
        });

        card.appendChild(opts);

        const rev = document.createElement("div");
        rev.className = `ans-review${submitted ? " show" : ""}`;
        if (submitted) {
          if (ansIdx === undefined) {
            rev.textContent = "Answer key not set.";
          } else if (chosenIdx === undefined) {
            rev.textContent = `Skipped (0) • Correct Answer: (${q.a}) ${q.o[ansIdx]}`;
          } else if (chosenIdx === ansIdx) {
            rev.textContent = `Correct (+4) • Answer: (${q.a}) ${q.o[ansIdx]}`;
          } else {
            rev.textContent = `Wrong (-1) • Your Pick: (${LETTERS[chosenIdx]}) • Correct Answer: (${q.a}) ${q.o[ansIdx]}`;
          }
        }
        card.appendChild(rev);

        qListEl.appendChild(card);
      });

      doneCountEl.textContent = done;

      if (submitted) {
        document.getElementById("scoreVal").textContent = right * 4 - wrong;
        document.getElementById("rightVal").textContent = right;
        document.getElementById("wrongVal").textContent = wrong;
        document.getElementById("skipVal").textContent = skip;
        document.getElementById("timeTakenVal").textContent = fmtTime(elapsedSec);
        reviewBannerEl.classList.add("show");
      } else {
        reviewBannerEl.classList.remove("show");
      }
    }

    document.getElementById("gridToggleBtn").onclick = () => setGridOpen(!gridOpen);
    document.getElementById("closeGridBtn").onclick = () => setGridOpen(false);
    paletteBackdropEl.onclick = (e) => {
      if (e.target === paletteBackdropEl) setGridOpen(false);
    };

    document.getElementById("submitBtn").onclick = () => {
      submitted = true;
      setGridOpen(false);
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    document.getElementById("resetBtn").onclick = () => {
      Object.keys(picks).forEach((k) => delete picks[k]);
      submitted = false;
      setGridOpen(false);
      elapsedSec = 0;
      elapsedEl.textContent = "00:00:00";
      render();
    };

    buildSectionJumpButtons();
    render();
  </script>
